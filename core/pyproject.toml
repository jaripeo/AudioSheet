[project]
name = "audiosheet"
version = "0.1.0"
description = "AudioSheet DSP/ML core — audio to sheet music and guitar tab, fully offline."
requires-python = ">=3.11,<3.12"
license = { text = "UNLICENSED" }
authors = [{ name = "AudioSheet" }]

# Phase 0 base dependencies. Heavier stacks are opt-in extras so that Phase 0
# bootstraps fast and cannot be broken by an unrelated wheel.
dependencies = [
  "numpy>=1.26,<2.3",
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "blake3>=0.4",
  "python-ulid>=2.2",
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# Phase 1 — ingestion and export.
ingest = ["soundfile>=0.12", "soxr>=0.4", "pyloudnorm>=0.1.1"]
notation = ["music21>=9.1", "pretty_midi>=0.2.10", "mido>=1.3"]
# Phase 3 — global analysis.
analysis = ["librosa>=0.10", "scipy>=1.11"]
# Phase 4/5 — separation and transcription.
ml = ["onnxruntime>=1.18"]
separation = ["torch>=2.2", "torchaudio>=2.2", "demucs>=4.0"]

[project.scripts]
audiosheet = "audiosheet.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-benchmark>=4.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-jsonschema>=4.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audiosheet"]

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-exclude = ["audiosheet/schema"]   # generated; see scripts/gen_schema.py

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "B",           # flake8-bugbear
  "A",           # flake8-builtins
  "C4",          # comprehensions
  "SIM",         # flake8-simplify
  "PTH",         # use pathlib
  "RUF",         # ruff-specific
  "D",           # pydocstyle
  "ANN",         # flake8-annotations
]
ignore = [
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "ANN401", # Any is deliberate at a few stage boundaries
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]
# tests/test_determinism.py imports scripts/gen_schema.py to assert the generator
# is deterministic.
mypy_path = "../scripts"
files = ["audiosheet", "tests"]
# Generated models are validated by their own round-trip test, not by mypy's
# opinion of code we do not hand-write.
exclude = "audiosheet/schema/.*"

[[tool.mypy.overrides]]
module = ["blake3.*", "ulid.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "gate: a phase exit-gate assertion (see ARCHITECTURE.md Section 5.3)",
  "slow: excluded from the default developer loop",
]
filterwarnings = ["error"]
