<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AudioSheet</title>
    <!--
      INV-1 (offline), enforced in the document as well as in the Electron shell:
      connect-src is limited to 'self', so nothing here can reach the network.
      The desktop shell sets the same policy as a response header (Section 4.1).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <meta name="color-scheme" content="light dark" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>AudioSheet needs JavaScript to render and play back a score.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
